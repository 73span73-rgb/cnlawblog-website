<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="deltaCompBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="compDeltaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#deltaCompBg)" rx="16"/>
  <circle cx="150" cy="350" r="180" fill="#e11d48" opacity="0.1" filter="blur(45px)"/>

  <rect x="40" y="40" width="920" height="420" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="url(#compDeltaGrad)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="80" y="95" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff">Delta Wi-Fi vs. Delta Sync Wi-Fi Comparison</text>
  <text x="80" y="125" font-family="sans-serif" font-size="15" fill="#cbd5e1">Understanding Terms, Systems &amp; SkyMiles Integration</text>

  <!-- Comparison Table Graphic -->
  <g transform="translate(80, 155)">
    <rect x="0" y="0" width="840" height="250" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="840" height="45" rx="12" fill="#0f172a"/>
    <text x="30" y="28" font-family="sans-serif" font-size="14" font-weight="800" fill="#e11d48">FEATURE / TERM</text>
    <text x="320" y="28" font-family="sans-serif" font-size="14" font-weight="800" fill="#cbd5e1">TRADITIONAL DELTA WI-FI</text>
    <text x="610" y="28" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8">DELTA SYNC WI-FI (NEW)</text>

    <!-- Row 1 -->
    <line x1="0" y1="45" x2="840" y2="45" stroke="#334155" stroke-width="1"/>
    <text x="30" y="75" font-family="sans-serif" font-size="13" fill="#ffffff">Pricing Model</text>
    <text x="320" y="75" font-family="sans-serif" font-size="13" fill="#cbd5e1">Paid Pass / Limited Free</text>
    <text x="610" y="75" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">Free for SkyMiles Members</text>

    <!-- Row 2 -->
    <line x1="0" y1="95" x2="840" y2="95" stroke="#334155" stroke-width="1"/>
    <text x="30" y="125" font-family="sans-serif" font-size="13" fill="#ffffff">Authentication</text>
    <text x="320" y="125" font-family="sans-serif" font-size="13" fill="#cbd5e1">Third-party Provider Login</text>
    <text x="610" y="125" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">SkyMiles Account Sign-In</text>

    <!-- Row 3 -->
    <line x1="0" y1="145" x2="840" y2="145" stroke="#334155" stroke-width="1"/>
    <text x="30" y="175" font-family="sans-serif" font-size="13" fill="#ffffff">Connected Devices</text>
    <text x="320" y="175" font-family="sans-serif" font-size="13" fill="#cbd5e1">1 Device Per Purchased Pass</text>
    <text x="610" y="175" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">Unlimited Devices per SkyMiles</text>

    <!-- Row 4 -->
    <line x1="0" y1="195" x2="840" y2="195" stroke="#334155" stroke-width="1"/>
    <text x="30" y="225" font-family="sans-serif" font-size="13" fill="#ffffff">Primary Fleet Route</text>
    <text x="320" y="225" font-family="sans-serif" font-size="13" fill="#cbd5e1">Legacy &amp; Select International</text>
    <text x="610" y="225" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Most U.S. Domestic Flights</text>
  </g>
</svg>
