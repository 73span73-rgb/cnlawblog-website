<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hrmsSecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132c"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="secGradHrms" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#hrmsSecBg)" rx="16"/>
  <circle cx="850" cy="380" r="190" fill="#10b981" opacity="0.1" filter="blur(45px)"/>

  <rect x="40" y="40" width="920" height="420" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="url(#secGradHrms)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="80" y="95" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff">HRMS Globex Security &amp; Role-Based Access Control</text>
  <text x="80" y="125" font-family="sans-serif" font-size="15" fill="#cbd5e1">Tiered Permissions &amp; Data Security Safeguards for Employees &amp; HR Administrators</text>

  <!-- Access Control Tiers -->
  <g transform="translate(80, 155)">
    <!-- Employee Tier -->
    <rect x="0" y="0" width="260" height="230" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <rect x="20" y="20" width="220" height="35" rx="6" fill="#34d399" fill-opacity="0.15"/>
    <text x="130" y="42" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">👤 EMPLOYEE ROLE</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Personal Profile Access</text>
    <text x="20" y="110" font-family="sans-serif" font-size="12" fill="#cbd5e1">• View Personal Attendance</text>
    <text x="20" y="135" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Submit Leave Requests</text>
    <text x="20" y="160" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Complete Self-Review</text>
    <text x="20" y="185" font-family="sans-serif" font-size="12" fill="#cbd5e1">• View Permitted Pay Info</text>

    <!-- Manager Tier -->
    <rect x="290" y="0" width="260" height="230" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="310" y="20" width="220" height="35" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="420" y="42" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">👔 MANAGER ROLE</text>
    <text x="310" y="85" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Team Roster &amp; Information</text>
    <text x="310" y="110" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Approve/Reject Leave</text>
    <text x="310" y="135" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Monitor Team Attendance</text>
    <text x="310" y="160" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Conduct Manager Reviews</text>
    <text x="310" y="185" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Access Team Workflows</text>

    <!-- HR Administrator Tier -->
    <rect x="580" y="0" width="260" height="230" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="600" y="20" width="220" height="35" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
    <text x="710" y="42" font-family="sans-serif" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle">🛡️ HR ADMIN ROLE</text>
    <text x="600" y="85" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Full Workforce Master File</text>
    <text x="600" y="110" font-family="sans-serif" font-size="12" fill="#cbd5e1">• System-Wide Attendance</text>
    <text x="600" y="135" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Payroll Administration</text>
    <text x="600" y="160" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Appraisal Workflow Control</text>
    <text x="600" y="185" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Role &amp; Permission Config</text>
  </g>
</svg>
