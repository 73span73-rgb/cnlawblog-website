<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgGrad2)" rx="16"/>
  <circle cx="200" cy="100" r="180" fill="#ec4899" opacity="0.12" filter="blur(30px)"/>

  <rect x="50" y="50" width="900" height="400" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- Left Content Illustration -->
  <text x="90" y="120" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff">Instagram Resources &amp; Captions Generator</text>
  <text x="90" y="155" font-family="sans-serif" font-size="16" fill="#cbd5e1">Fento Magazine Social Media Tools: Bio Ideas, Comments &amp; Captions</text>

  <!-- Interactive Grid Cards -->
  <g transform="translate(90, 200)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="240" height="200" rx="12" fill="#1e293b" stroke="url(#pinkGrad)" stroke-width="2"/>
    <circle cx="40" cy="40" r="18" fill="url(#pinkGrad)"/>
    <text x="70" y="45" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff">Captions Hub</text>
    <text x="20" y="90" font-family="sans-serif" font-size="13" fill="#94a3b8">• Travel &amp; Lifestyle</text>
    <text x="20" y="115" font-family="sans-serif" font-size="13" fill="#94a3b8">• Fashion &amp; Friendship</text>
    <text x="20" y="140" font-family="sans-serif" font-size="13" fill="#94a3b8">• Funny &amp; Motivational</text>
    <text x="20" y="170" font-family="sans-serif" font-size="12" font-weight="700" fill="#ec4899">Browse 1000+ Captions →</text>

    <!-- Card 2 -->
    <rect x="270" y="0" width="240" height="200" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="310" cy="40" r="18" fill="#3b82f6"/>
    <text x="340" y="45" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff">Bio Ideas</text>
    <text x="290" y="90" font-family="sans-serif" font-size="13" fill="#94a3b8">• Short &amp; Creative</text>
    <text x="290" y="115" font-family="sans-serif" font-size="13" fill="#94a3b8">• Professional Creator</text>
    <text x="290" y="140" font-family="sans-serif" font-size="13" fill="#94a3b8">• Humor &amp; Personal Values</text>
    <text x="290" y="170" font-family="sans-serif" font-size="12" font-weight="700" fill="#60a5fa">Explore Bio Templates →</text>

    <!-- Card 3 -->
    <rect x="540" y="0" width="280" height="200" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="580" cy="40" r="18" fill="#10b981"/>
    <text x="610" y="45" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff">Captions Generator</text>
    <text x="560" y="90" font-family="sans-serif" font-size="13" fill="#94a3b8">AI-assisted wording generator for instant Instagram posts &amp; reels.</text>
    
    <rect x="560" y="135" width="240" height="40" rx="20" fill="#10b981"/>
    <text x="680" y="160" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Generate Caption Now</text>
  </g>
</svg>
