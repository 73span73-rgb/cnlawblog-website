<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="deltaHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329"/>
      <stop offset="50%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#143b66"/>
    </linearGradient>
    <linearGradient id="deltaRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="deltaBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="deltaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#deltaHeroBg)"/>

  <!-- Subtle Glowing Orbs -->
  <circle cx="200" cy="180" r="250" fill="#0284c7" opacity="0.15" filter="blur(60px)"/>
  <circle cx="1000" cy="450" r="280" fill="#e11d48" opacity="0.12" filter="blur(60px)"/>

  <!-- Satellite Waves & Flight Paths -->
  <path d="M 100,500 Q 400,200 900,120" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="8 8" fill="none"/>
  <path d="M 100,550 Q 500,250 1100,200" stroke="#f43f5e" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="12 6" fill="none"/>

  <!-- Main Glass Container Card -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="#ffffff" fill-opacity="0.04" stroke="url(#deltaBlueGrad)" stroke-width="2" filter="url(#deltaShadow)"/>

  <!-- Left Content Column -->
  <text x="140" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#f43f5e" letter-spacing="2">INFLIGHT WI-FI &amp; SKYMILES PORTAL GUIDE</text>
  
  <text x="140" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-weight="900" fill="#ffffff">Deltawifi.com Login</text>
  
  <text x="140" y="265" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600" fill="#cbd5e1">Inflight Wi-Fi, SkyMiles Sync &amp; Troubleshooting</text>

  <!-- Feature Badges -->
  <g transform="translate(140, 310)">
    <rect x="0" y="0" width="160" height="42" rx="21" fill="url(#deltaRedGrad)"/>
    <text x="80" y="26" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">✈️ Inflight Wi-Fi</text>

    <rect x="175" y="0" width="170" height="42" rx="21" fill="url(#deltaBlueGrad)"/>
    <text x="260" y="26" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">🌐 Delta Sync Portal</text>

    <rect x="360" y="0" width="160" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="440" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">🔑 SkyMiles Free</text>
  </g>

  <!-- Right Side Graphic: Aircraft & Mobile Connectivity Portal -->
  <g transform="translate(730, 120)">
    <!-- Smartphone Shell -->
    <rect x="40" y="0" width="280" height="400" rx="30" fill="#0f172a" stroke="#0284c7" stroke-width="3" filter="url(#deltaShadow)"/>
    <rect x="52" y="16" width="256" height="368" rx="20" fill="#030712"/>

    <!-- Screen Header -->
    <rect x="65" y="35" width="230" height="45" rx="10" fill="#1e293b"/>
    <circle cx="85" cy="57" r="10" fill="#e11d48"/>
    <text x="85" y="61" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">Δ</text>
    <text x="105" y="62" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">Delta Sync Wi-Fi</text>

    <!-- Portal Status Box -->
    <rect x="65" y="95" width="230" height="120" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1.5"/>
    <text x="180" y="130" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">CONNECTED TO</text>
    <text x="180" y="155" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">DeltaWiFi.com</text>
    <text x="180" y="180" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Status: Inflight Broadband Active</text>

    <!-- SkyMiles Login Button -->
    <g transform="translate(65, 235)">
      <rect x="0" y="0" width="230" height="48" rx="24" fill="url(#deltaRedGrad)"/>
      <text x="115" y="29" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Sign In with SkyMiles →</text>
    </g>

    <!-- Free Messaging Option -->
    <g transform="translate(65, 298)">
      <rect x="0" y="0" width="230" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="115" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">💬 Free Inflight Messaging</text>
    </g>
  </g>

  <!-- CNLawBlog Seal -->
  <g transform="translate(140, 415)">
    <rect x="0" y="0" width="410" height="65" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff">CNLawBlog Business &amp; Travel Tech Guide</text>
    <text x="20" y="48" font-family="sans-serif" font-size="12" fill="#94a3b8">Verified Inflight Connectivity Review • cnlawblog.shop</text>
  </g>
</svg>
