<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132C"/>
      <stop offset="100%" stop-color="#070D1E"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Rounded Square -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="8"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#teal-grad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.6"/>

  <!-- Main Scales of Justice & Tech Emblem -->
  <g transform="translate(0, 0)">
    <!-- Central Pillar -->
    <rect x="246" y="120" width="20" height="230" rx="10" fill="url(#gold-grad)"/>
    <!-- Pillar Base -->
    <path d="M190 350 H322 C330 350 335 360 328 368 L310 390 H202 L184 368 C177 360 182 350 190 350 Z" fill="url(#gold-grad)"/>
    
    <!-- Top Finial / Tech Node -->
    <circle cx="256" cy="115" r="24" fill="url(#teal-grad)" stroke="#0B132C" stroke-width="4"/>
    <circle cx="256" cy="115" r="10" fill="#FFFFFF"/>

    <!-- Main Balance Beam -->
    <path d="M110 170 H402" stroke="url(#gold-grad)" stroke-width="18" stroke-linecap="round"/>
    <!-- Center Beam Connector -->
    <circle cx="256" cy="170" r="18" fill="url(#gold-grad)"/>

    <!-- Left Scale strings & Pan -->
    <line x1="140" y1="170" x2="105" y2="270" stroke="#94A3B8" stroke-width="5"/>
    <line x1="140" y1="170" x2="175" y2="270" stroke="#94A3B8" stroke-width="5"/>
    <path d="M90 270 Q140 315 190 270 Z" fill="url(#teal-grad)" stroke="url(#gold-grad)" stroke-width="4"/>

    <!-- Right Scale strings & Pan -->
    <line x1="372" y1="170" x2="337" y2="270" stroke="#94A3B8" stroke-width="5"/>
    <line x1="372" y1="170" x2="407" y2="270" stroke="#94A3B8" stroke-width="5"/>
    <path d="M322 270 Q372 315 422 270 Z" fill="url(#teal-grad)" stroke="url(#gold-grad)" stroke-width="4"/>
  </g>
</svg>
