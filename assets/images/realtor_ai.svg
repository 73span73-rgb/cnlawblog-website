<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rAiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132c"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#rAiBg)" rx="16"/>
  <circle cx="850" cy="100" r="200" fill="#ec4899" opacity="0.12" filter="blur(50px)"/>

  <rect x="40" y="40" width="920" height="420" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="url(#aiGrad)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="80" y="100" font-family="sans-serif" font-size="26" font-weight="900" fill="#ffffff">Realtor.com RealAssist™ AI &amp; Conversational Discovery</text>
  <text x="80" y="130" font-family="sans-serif" font-size="15" fill="#cbd5e1">Powered by Google Gemini &amp; Google Cloud + ChatGPT Integration</text>

  <!-- AI Feature Cards -->
  <g transform="translate(80, 160)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="260" height="230" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="25" y="40" font-family="sans-serif" font-size="18" font-weight="800" fill="#a78bfa">RealAssist™ AI</text>
    <text x="25" y="75" font-family="sans-serif" font-size="13" fill="#94a3b8">• Conversational Queries</text>
    <text x="25" y="100" font-family="sans-serif" font-size="13" fill="#94a3b8">• Powered by Google Gemini</text>
    <text x="25" y="125" font-family="sans-serif" font-size="13" fill="#94a3b8">• Natural Language Search</text>
    <text x="25" y="150" font-family="sans-serif" font-size="13" fill="#94a3b8">• Instant Property Matches</text>
    <text x="25" y="195" font-family="sans-serif" font-size="12" font-weight="700" fill="#c084fc">Try RealAssist™ AI →</text>

    <!-- Card 2 -->
    <rect x="290" y="0" width="260" height="230" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="315" y="40" font-family="sans-serif" font-size="18" font-weight="800" fill="#f472b6">ChatGPT Integration</text>
    <text x="315" y="75" font-family="sans-serif" font-size="13" fill="#94a3b8">• In-App ChatGPT Search</text>
    <text x="315" y="100" font-family="sans-serif" font-size="13" fill="#94a3b8">• Affordability Queries</text>
    <text x="315" y="125" font-family="sans-serif" font-size="13" fill="#94a3b8">• Home Exploration</text>
    <text x="315" y="150" font-family="sans-serif" font-size="13" fill="#94a3b8">• Seamless Redirection</text>
    <text x="315" y="195" font-family="sans-serif" font-size="12" font-weight="700" fill="#f472b6">Explore ChatGPT App →</text>

    <!-- Card 3 -->
    <rect x="580" y="0" width="260" height="230" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="605" y="40" font-family="sans-serif" font-size="18" font-weight="800" fill="#f59e0b">Realtor.com+ Pro</text>
    <text x="605" y="75" font-family="sans-serif" font-size="13" fill="#94a3b8">• Agent Collaboration</text>
    <text x="605" y="100" font-family="sans-serif" font-size="13" fill="#94a3b8">• Tour Route Optimization</text>
    <text x="605" y="125" font-family="sans-serif" font-size="13" fill="#94a3b8">• MLS Ecosystem Link</text>
    <text x="605" y="150" font-family="sans-serif" font-size="13" fill="#94a3b8">• Client Tour Planning</text>
    <text x="605" y="195" font-family="sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Explore Pro Tools →</text>
