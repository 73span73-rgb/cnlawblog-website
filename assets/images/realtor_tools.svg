<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rToolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#rToolBg)" rx="16"/>
  <circle cx="200" cy="380" r="200" fill="#10b981" opacity="0.1" filter="blur(45px)"/>

  <rect x="40" y="40" width="920" height="420" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="url(#calcGrad)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="80" y="100" font-family="sans-serif" font-size="26" font-weight="900" fill="#ffffff">Realtor.com Affordability &amp; Mortgage Calculators</text>
  <text x="80" y="130" font-family="sans-serif" font-size="15" fill="#cbd5e1">Estimating Realistic Budgets, Principal, Interest, Taxes &amp; Down Payment Assistance</text>

  <!-- Calculator Components -->
  <g transform="translate(80, 160)">
    <!-- Column 1 -->
    <rect x="0" y="0" width="400" height="230" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="30" y="40" font-family="sans-serif" font-size="18" font-weight="800" fill="#10b981">Affordability Calculator</text>
    
    <text x="30" y="80" font-family="sans-serif" font-size="13" fill="#94a3b8">Target Purchase Budget:</text>
    <text x="220" y="80" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff">$450,000</text>
    
    <text x="30" y="110" font-family="sans-serif" font-size="13" fill="#94a3b8">Est. Monthly Payment:</text>
    <text x="220" y="110" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">$2,650 / mo</text>

    <text x="30" y="140" font-family="sans-serif" font-size="13" fill="#94a3b8">Includes Taxes &amp; Ins:</text>
    <text x="220" y="140" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Included</text>

    <rect x="30" y="170" width="340" height="35" rx="8" fill="#10b981"/>
    <text x="200" y="192" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Calculate Your Budget Range</text>

    <!-- Column 2 -->
    <rect x="440" y="0" width="400" height="230" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="470" y="40" font-family="sans-serif" font-size="18" font-weight="800" fill="#3b82f6">Down Payment &amp; My Home</text>
    
    <text x="470" y="80" font-family="sans-serif" font-size="13" fill="#94a3b8">• Down Payment Assistance Programs</text>
    <text x="470" y="108" font-family="sans-serif" font-size="13" fill="#94a3b8">• My Home Dashboard for Owners</text>
    <text x="470" y="136" font-family="sans-serif" font-size="13" fill="#94a3b8">• Home Equity &amp; Renovation Tracking</text>
    <text x="470" y="164" font-family="sans-serif" font-size="13" fill="#94a3b8">• Rent vs. Buy Analysis</text>

    <text x="470" y="200" font-family="sans-serif" font-size="12" font-weight="700" fill="#60a5fa">Explore Financial Resources →</text>
  </g>
</svg>
