<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="sdHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132c"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sdPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sdCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="sdShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#sdHeroBg)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glowing Accents -->
  <circle cx="180" cy="180" r="240" fill="#a855f7" opacity="0.1" filter="blur(50px)"/>
  <circle cx="1020" cy="450" r="260" fill="#06b6d4" opacity="0.1" filter="blur(50px)"/>

  <!-- Main Container Card -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#ffffff" fill-opacity="0.04" stroke="url(#sdPurpleGrad)" stroke-width="2" filter="url(#sdShadow)"/>

  <!-- Left Content Info -->
  <text x="140" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#c084fc" letter-spacing="2">DIGITAL PUBLISHING &amp; MULTI-TOPIC GUIDE</text>
  
  <text x="140" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="#ffffff">SimplifyDiggs.com Guide</text>
  
  <text x="140" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600" fill="#cbd5e1">Content, Features, Credibility &amp; Reader Insights</text>

  <!-- Category Badges -->
  <g transform="translate(140, 320)">
    <rect x="0" y="0" width="140" height="40" rx="20" fill="url(#sdPurpleGrad)"/>
    <text x="70" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Technology</text>

    <rect x="155" y="0" width="130" height="40" rx="20" fill="url(#sdCyanGrad)"/>
    <text x="220" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Business</text>

    <rect x="300" y="0" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="360" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Travel</text>

    <rect x="435" y="0" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="495" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Gaming</text>
  </g>

  <!-- Right Side Graphic: Multi-Niche Publishing Portal Mockup -->
  <g transform="translate(740, 140)">
    <rect x="0" y="0" width="280" height="380" rx="24" fill="#1e1b4b" stroke="#475569" stroke-width="3" filter="url(#sdShadow)"/>
    <rect x="12" y="16" width="256" height="348" rx="16" fill="#0f172a"/>

    <!-- Search Header -->
    <rect x="25" y="35" width="230" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="60" font-family="sans-serif" font-size="12" fill="#94a3b8">🌐 SimplifyDiggs.com Portal</text>

    <!-- Content Card 1 -->
    <g transform="translate(25, 90)">
      <rect x="0" y="0" width="230" height="110" rx="10" fill="#1e293b"/>
      <text x="15" y="30" font-family="sans-serif" font-size="12" font-weight="800" fill="#c084fc">TECH &amp; DIGITAL TRENDS</text>
      <text x="15" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Cloud, AI &amp; Software Guides</text>
      <text x="15" y="80" font-family="sans-serif" font-size="11" fill="#94a3b8">Accessible explanations for beginners.</text>
    </g>

    <!-- Content Card 2 -->
    <g transform="translate(25, 215)">
      <rect x="0" y="0" width="230" height="115" rx="10" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-width="1"/>
      <text x="15" y="30" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8">MULTI-NICHE HUB</text>
      <text x="15" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1">Business, Auto, Travel &amp; Lifestyle</text>
      <rect x="15" y="65" width="200" height="35" rx="6" fill="url(#sdPurpleGrad)"/>
      <text x="115" y="87" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Explore Articles →</text>
    </g>
  </g>

  <!-- CNLawBlog Footer Seal -->
  <g transform="translate(140, 420)">
    <rect x="0" y="0" width="380" height="70" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff">CNLawBlog Tech &amp; Media Analysis</text>
    <text x="20" y="52" font-family="sans-serif" font-size="12" fill="#94a3b8">Verified Editorial Review • cnlawblog.shop</text>
  </g>
</svg>
