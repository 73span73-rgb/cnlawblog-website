<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="deltaTroubleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="troubleGradDelta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#deltaTroubleBg)" rx="16"/>
  <circle cx="850" cy="380" r="190" fill="#38bdf8" opacity="0.1" filter="blur(45px)"/>

  <rect x="40" y="40" width="920" height="420" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="url(#troubleGradDelta)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="80" y="95" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff">Deltawifi.com Login Troubleshooting &amp; Fixes</text>
  <text x="80" y="125" font-family="sans-serif" font-size="15" fill="#cbd5e1">What to Do When the Onboard Portal Sign-In Page Doesn't Load</text>

  <!-- Troubleshooting Cards -->
  <g transform="translate(80, 155)">
    <!-- Fix 1 -->
    <rect x="0" y="0" width="260" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8">1. Manual URL Entry</text>
    <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Open browser and type:</text>
    <text x="20" y="85" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">deltawifi.com</text>

    <!-- Fix 2 -->
    <rect x="290" y="0" width="260" height="110" rx="12" fill="#1e293b" stroke="#e11d48" stroke-width="1.5"/>
    <text x="310" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#e11d48">2. Forget This Network</text>
    <text x="310" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Forget DeltaWiFi.com,</text>
    <text x="310" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">toggle Wi-Fi off/on &amp; reconnect</text>

    <!-- Fix 3 -->
    <rect x="580" y="0" width="260" height="110" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="600" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#fbbf24">3. Turn VPN Off First</text>
    <text x="600" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Disable VPN before portal</text>
    <text x="600" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">sign-in, then enable after</text>

    <!-- Fix 4 -->
    <rect x="0" y="130" width="260" height="110" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="165" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">4. Clear Browser Cache</text>
    <text x="20" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">Close browser tab or try</text>
    <text x="20" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">incognito/private mode</text>

    <!-- Fix 5 -->
    <rect x="290" y="130" width="260" height="110" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="310" y="165" font-family="sans-serif" font-size="14" font-weight="800" fill="#c084fc">5. Check Inflight Status</text>
    <text x="310" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">Ensure aircraft has reached</text>
    <text x="310" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">Wi-Fi operating altitude</text>
  </g>
</svg>
