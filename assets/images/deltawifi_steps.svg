<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="deltaStepsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="deltaRedLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#deltaStepsBg)" rx="16"/>
  <circle cx="900" cy="100" r="180" fill="#0284c7" opacity="0.12" filter="blur(45px)"/>

  <rect x="40" y="40" width="920" height="420" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="url(#deltaRedLine)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="80" y="95" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff">5 Steps to Connect to Delta Wi-Fi Onboard</text>
  <text x="80" y="125" font-family="sans-serif" font-size="15" fill="#cbd5e1">Step-by-Step Connection &amp; Portal Sign-In Guide</text>

  <!-- Horizontal Connection Roadmap -->
  <g transform="translate(80, 160)">
    <!-- Roadmap Steps -->
    <!-- Step 1 -->
    <rect x="0" y="0" width="160" height="240" rx="14" fill="#1e293b" stroke="#e11d48" stroke-width="2"/>
    <circle cx="80" cy="45" r="24" fill="#e11d48"/>
    <text x="80" y="52" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
    <text x="80" y="95" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Airplane Mode</text>
    <text x="80" y="125" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Turn on Airplane</text>
    <text x="80" y="142" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Mode, then re-enable</text>
    <text x="80" y="159" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Wi-Fi on device</text>

    <!-- Connector Arrow 1 -->
    <path d="M 165,120 L 175,120" stroke="#f43f5e" stroke-width="3"/>

    <!-- Step 2 -->
    <rect x="180" y="0" width="160" height="240" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="260" cy="45" r="24" fill="#0284c7"/>
    <text x="260" y="52" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
    <text x="260" y="95" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Select Network</text>
    <text x="260" y="125" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Select network:</text>
    <text x="260" y="145" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">DeltaWiFi.com</text>

    <!-- Step 3 -->
    <rect x="360" y="0" width="160" height="240" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="440" cy="45" r="24" fill="#d97706"/>
    <text x="440" y="52" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
    <text x="440" y="95" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Open Browser</text>
    <text x="440" y="125" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">If popup fails, type</text>
    <text x="440" y="145" font-family="sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="middle">deltawifi.com</text>
    <text x="440" y="165" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">in address bar</text>

    <!-- Step 4 -->
    <rect x="540" y="0" width="160" height="240" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <circle cx="620" cy="45" r="24" fill="#9333ea"/>
    <text x="620" y="52" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">4</text>
    <text x="620" y="95" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">SkyMiles Sign-In</text>
    <text x="620" y="125" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Sign in to SkyMiles</text>
    <text x="620" y="142" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">for free Delta Sync</text>
    <text x="620" y="159" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">or select messaging</text>

    <!-- Step 5 -->
    <rect x="720" y="0" width="160" height="240" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <circle cx="800" cy="45" r="24" fill="#10b981"/>
    <text x="800" y="52" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
    <text x="800" y="95" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Start Browsing</text>
    <text x="800" y="125" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Enjoy inflight</text>
    <text x="800" y="142" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">internet, email &amp;</text>
    <text x="800" y="159" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">messaging</text>
  </g>
</svg>
