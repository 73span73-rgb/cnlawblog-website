<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132c"/>
      <stop offset="50%" stop-color="#15244c"/>
      <stop offset="100%" stop-color="#0d1b3e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Decorative Glowing Circles -->
  <circle cx="150" cy="150" r="220" fill="#10b981" opacity="0.08" filter="blur(40px)"/>
  <circle cx="1050" cy="480" r="260" fill="#3b82f6" opacity="0.1" filter="blur(50px)"/>

  <!-- Main Digital Magazine Container Card -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#ffffff" fill-opacity="0.04" stroke="url(#accentGrad)" stroke-width="2" filter="url(#dropShadow)"/>

  <!-- Left Content Info -->
  <text x="140" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#10b981" letter-spacing="2">DIGITAL PUBLICATION &amp; TECH REVIEW</text>
  
  <text x="140" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff">Fentomagazine.com USA</text>
  
  <text x="140" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1">Complete Guide to Fento Magazine &amp; Features</text>
  
  <!-- Topic Badges -->
  <g transform="translate(140, 320)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="160" height="40" rx="20" fill="url(#accentGrad)"/>
    <text x="80" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Tech &amp; AI</text>
    
    <!-- Badge 2 -->
    <rect x="175" y="0" width="180" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="265" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Instagram Captions</text>
    
    <!-- Badge 3 -->
    <rect x="370" y="0" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="455" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Business &amp; News</text>
  </g>

  <!-- Right Side Mockup Graphic: Smartphone & Captions Generator -->
  <g transform="translate(740, 140)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="280" height="380" rx="36" fill="#1e293b" stroke="#475569" stroke-width="4" filter="url(#dropShadow)"/>
    <!-- Screen -->
    <rect x="12" y="20" width="256" height="340" rx="24" fill="#0f172a"/>
    <!-- Phone Notch -->
    <rect x="90" y="28" width="100" height="12" rx="6" fill="#1e293b"/>
    
    <!-- App Header -->
    <text x="140" y="70" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Fento Captions Gen</text>
    <line x1="30" y1="85" x2="250" y2="85" stroke="#334155" stroke-width="1"/>

    <!-- Sample Caption Cards -->
    <rect x="30" y="105" width="220" height="50" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="45" y="128" font-family="sans-serif" font-size="12" font-weight="700" fill="#10b981">✨ Trending Instagram Caption</text>
    <text x="45" y="144" font-family="sans-serif" font-size="11" fill="#94a3b8">"Chasing digital dreams &amp; code..."</text>

    <rect x="30" y="170" width="220" height="50" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
    <text x="45" y="193" font-family="sans-serif" font-size="12" font-weight="700" fill="#60a5fa">🔥 Instagram Bio Idea</text>
    <text x="45" y="209" font-family="sans-serif" font-size="11" fill="#94a3b8">"Tech Analyst | Digital Creator 🚀"</text>

    <rect x="30" y="235" width="220" height="50" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="45" y="258" font-family="sans-serif" font-size="12" font-weight="700" fill="#fbbf24">💡 Tech Article Insights</text>
    <text x="45" y="274" font-family="sans-serif" font-size="11" fill="#94a3b8">"Understanding Fento Magazine USA"</text>

    <!-- Generator Button -->
    <rect x="30" y="300" width="220" height="36" rx="18" fill="url(#accentGrad)"/>
    <text x="140" y="323" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Generate New Caption</text>
  </g>

  <!-- CNLawBlog Branding Seal -->
  <g transform="translate(140, 420)">
    <rect x="0" y="0" width="380" height="70" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff">CNLawBlog Official Publishing Review</text>
    <text x="20" y="52" font-family="sans-serif" font-size="12" fill="#94a3b8">Verified Editorial &amp; Tech Guide • cnlawblog.shop</text>
  </g>
</svg>
