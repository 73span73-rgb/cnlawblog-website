<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="eleadHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132c"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="eleadOrangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="eleadBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="eleadShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#eleadHeroBg)"/>

  <!-- Subtle Glowing Orbs -->
  <circle cx="200" cy="180" r="250" fill="#f97316" opacity="0.15" filter="blur(60px)"/>
  <circle cx="1000" cy="450" r="280" fill="#2563eb" opacity="0.12" filter="blur(60px)"/>

  <!-- Main Glass Container Card -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="#ffffff" fill-opacity="0.04" stroke="url(#eleadOrangeGrad)" stroke-width="2" filter="url(#eleadShadow)"/>

  <!-- Left Content Column -->
  <text x="140" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#fb923c" letter-spacing="2">AUTOMOTIVE DEALERSHIP CRM PORTAL</text>
  
  <text x="140" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-weight="900" fill="#ffffff">Eleads Login Guide</text>
  
  <text x="140" y="265" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600" fill="#cbd5e1">Official CRM Portal, SSO, Reset &amp; Troubleshooting</text>

  <!-- Feature Badges -->
  <g transform="translate(140, 310)">
    <rect x="0" y="0" width="170" height="42" rx="21" fill="url(#eleadOrangeGrad)"/>
    <text x="85" y="26" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">🚗 Dealership CRM</text>

    <rect x="185" y="0" width="170" height="42" rx="21" fill="url(#eleadBlueGrad)"/>
    <text x="270" y="26" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">🔑 SSO Single Sign-On</text>

    <rect x="370" y="0" width="160" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="450" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">⚙️ CDK Global</text>
  </g>

  <!-- Right Side Graphic: Automotive CRM Dashboard Mockup -->
  <g transform="translate(730, 120)">
    <rect x="0" y="0" width="290" height="390" rx="20" fill="#0f172a" stroke="#2563eb" stroke-width="2" filter="url(#eleadShadow)"/>
    <rect x="12" y="16" width="266" height="358" rx="14" fill="#020617"/>

    <!-- Screen Header -->
    <rect x="25" y="32" width="240" height="40" rx="8" fill="#1e293b"/>
    <circle cx="45" cy="52" r="8" fill="#f97316"/>
    <text x="62" y="57" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">Elead CRM Portal</text>

    <!-- Lead Pipeline Card -->
    <g transform="translate(25, 85)">
      <rect x="0" y="0" width="240" height="90" rx="10" fill="#1e293b"/>
      <text x="15" y="26" font-family="sans-serif" font-size="11" font-weight="800" fill="#fb923c">RECENT LEAD ACTIVITY</text>
      <text x="15" y="48" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">John Doe • 2026 SUV Inquiry</text>
      <rect x="15" y="60" width="110" height="18" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="70" y="73" font-family="sans-serif" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle">STATUS: NEW LEAD</text>
    </g>

    <!-- SSO Auth Status Card -->
    <g transform="translate(25, 190)">
      <rect x="0" y="0" width="240" height="85" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-dasharray="3 3" stroke-width="1.5"/>
      <text x="15" y="26" font-family="sans-serif" font-size="11" font-weight="800" fill="#60a5fa">AUTHENTICATION MODE</text>
      <text x="15" y="48" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Dealership SSO (Okta / OneLogin)</text>
      <text x="15" y="68" font-family="sans-serif" font-size="10" fill="#94a3b8">Active Authorized Session</text>
    </g>

    <!-- Sign In CTA Button -->
    <g transform="translate(25, 290)">
      <rect x="0" y="0" width="240" height="44" rx="22" fill="url(#eleadOrangeGrad)"/>
      <text x="120" y="27" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Access Dealership CRM →</text>
    </g>
  </g>

  <!-- CNLawBlog Seal -->
  <g transform="translate(140, 415)">
    <rect x="0" y="0" width="410" height="65" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff">CNLawBlog Business &amp; Automotive Guide</text>
    <text x="20" y="48" font-family="sans-serif" font-size="12" fill="#94a3b8">Verified Dealership Software Review • cnlawblog.shop</text>
  </g>
</svg>
