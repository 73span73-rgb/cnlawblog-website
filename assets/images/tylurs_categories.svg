    <text x="20" y="222" font-family="sans-serif" font-size="15" font-weight="800" fill="#38bdf8">7. ✈️ Travel</text>
    <text x="20" y="245" font-family="sans-serif" font-size="11" fill="#94a3b8">Destination Ideas &amp; Planning</text>

