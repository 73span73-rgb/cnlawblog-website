    <text x="310" y="222" font-family="sans-serif" font-size="15" font-weight="800" fill="#a7f3d0">8. 🏡 Home Improvement</text>
    <text x="310" y="245" font-family="sans-serif" font-size="11" fill="#94a3b8">Upgrades, Projects &amp; Maintenance</text>

