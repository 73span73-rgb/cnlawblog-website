    <text x="600" y="222" font-family="sans-serif" font-size="15" font-weight="800" fill="#f87171">9. ⚖️ Law</text>
    <text x="600" y="245" font-family="sans-serif" font-size="11" fill="#94a3b8">Legal Topics &amp; General Guides</text>
