<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tylCatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="catAccentTyl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#tylCatBg)" rx="16"/>
  <circle cx="850" cy="120" r="180" fill="#6366f1" opacity="0.12" filter="blur(45px)"/>

  <rect x="40" y="40" width="920" height="420" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="url(#catAccentTyl)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="80" y="95" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff">Tylurs.com 9 Core Content Verticals</text>
  <text x="80" y="125" font-family="sans-serif" font-size="15" fill="#cbd5e1">Broad Informational Coverage Across Everyday &amp; Professional Life</text>

  <!-- Categories Grid -->
  <g transform="translate(80, 155)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="260" height="80" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="20" y="32" font-family="sans-serif" font-size="15" font-weight="800" fill="#818cf8">1. 💻 Technology</text>
    <text x="20" y="55" font-family="sans-serif" font-size="11" fill="#94a3b8">Software, Apps &amp; Tech Trends</text>

    <rect x="290" y="0" width="260" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="310" y="32" font-family="sans-serif" font-size="15" font-weight="800" fill="#38bdf8">2. 💰 Finance</text>
    <text x="310" y="55" font-family="sans-serif" font-size="11" fill="#94a3b8">Personal Finance &amp; Banking</text>

    <rect x="580" y="0" width="260" height="80" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="600" y="32" font-family="sans-serif" font-size="15" font-weight="800" fill="#34d399">3. 📊 Business</text>
    <text x="600" y="55" font-family="sans-serif" font-size="11" fill="#94a3b8">Entrepreneurship &amp; Marketing</text>

    <!-- Row 2 -->
    <rect x="0" y="95" width="260" height="80" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <text x="20" y="127" font-family="sans-serif" font-size="15" font-weight="800" fill="#f472b6">4. 🩺 Health</text>
    <text x="20" y="150" font-family="sans-serif" font-size="11" fill="#94a3b8">Wellness &amp; General Health</text>

    <rect x="290" y="95" width="260" height="80" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="310" y="127" font-family="sans-serif" font-size="15" font-weight="800" fill="#c084fc">5. 🎓 Education</text>
    <text x="310" y="150" font-family="sans-serif" font-size="11" fill="#94a3b8">Learning &amp; Academic Concepts</text>

    <rect x="580" y="95" width="260" height="80" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="600" y="127" font-family="sans-serif" font-size="15" font-weight="800" fill="#fbbf24">6. 🌱 Lifestyle</text>
    <text x="600" y="150" font-family="sans-serif" font-size="11" fill="#94a3b8">Daily Life &amp; Consumer Topics</text>

    <!-- Row 3 -->
