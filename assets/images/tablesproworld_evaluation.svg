<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tpwEvalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132c"/>
      <stop offset="100%" stop-color="#0f2942"/>
    </linearGradient>
    <linearGradient id="evalGradTpw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#tpwEvalBg)" rx="16"/>
  <circle cx="850" cy="380" r="190" fill="#14b8a6" opacity="0.1" filter="blur(45px)"/>

  <rect x="40" y="40" width="920" height="420" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="url(#evalGradTpw)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="80" y="95" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff">5-Step Checklist Before Relying on TablesProWorld Articles</text>
  <text x="80" y="125" font-family="sans-serif" font-size="15" fill="#cbd5e1">Simple Verification Rules for Responsible Digital Research</text>

  <!-- Checklist Components -->
  <g transform="translate(80, 155)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="260" height="110" rx="12" fill="#152e4d" stroke="#2dd4bf" stroke-width="1"/>
    <text x="20" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#2dd4bf">1. Publication Date</text>
    <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Is the information current?</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">Crucial for tech, finance &amp; travel.</text>

    <!-- Item 2 -->
    <rect x="290" y="0" width="260" height="110" rx="12" fill="#152e4d" stroke="#38bdf8" stroke-width="1"/>
    <text x="310" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8">2. Author Transparency</text>
    <text x="310" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Is the author identifiable?</text>
    <text x="310" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">Check relevant topic background.</text>

    <!-- Item 3 -->
    <rect x="580" y="0" width="260" height="110" rx="12" fill="#152e4d" stroke="#fbbf24" stroke-width="1"/>
    <text x="600" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#fbbf24">3. Supporting Evidence</text>
    <text x="600" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Are key claims supported?</text>
    <text x="600" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">Look for external references.</text>

    <!-- Item 4 -->
    <rect x="0" y="130" width="260" height="110" rx="12" fill="#152e4d" stroke="#34d399" stroke-width="1"/>
    <text x="20" y="165" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">4. Independent Proof</text>
    <text x="20" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">Can facts be confirmed</text>
    <text x="20" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">on official primary sources?</text>

    <!-- Item 5 -->
    <rect x="290" y="130" width="260" height="110" rx="12" fill="#152e4d" stroke="#c084fc" stroke-width="1"/>
    <text x="310" y="165" font-family="sans-serif" font-size="14" font-weight="800" fill="#c084fc">5. Decision Context</text>
    <text x="310" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">Is it low-risk intro reading</text>
    <text x="310" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">or a high-stakes decision?</text>
  </g>
</svg>
