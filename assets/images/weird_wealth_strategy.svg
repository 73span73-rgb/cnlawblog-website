<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wwStratBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="stratGradWw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#wwStratBg)" rx="16"/>
  <circle cx="850" cy="380" r="190" fill="#38bdf8" opacity="0.1" filter="blur(45px)"/>

  <rect x="40" y="40" width="920" height="420" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="url(#stratGradWw)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="80" y="95" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff">6-Step Strategy to Build Niche Weird Wealth</text>
  <text x="80" y="125" font-family="sans-serif" font-size="15" fill="#cbd5e1">Actionable Blueprint for Unconventional Business Creation</text>

  <!-- Roadmap Steps Grid -->
  <g transform="translate(80, 155)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="260" height="110" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">1. Choose Specific Market</text>
    <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Avoid targeting everyone;</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">focus on a defined group</text>

    <!-- Step 2 -->
    <rect x="290" y="0" width="260" height="110" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="310" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#fbbf24">2. Find Painful Problem</text>
    <text x="310" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Identify tasks people already</text>
    <text x="310" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">pay money to solve</text>

    <!-- Step 3 -->
    <rect x="580" y="0" width="260" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="600" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8">3. Build Small Solution</text>
    <text x="600" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Create a focused MVP that</text>
    <text x="600" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">solves one problem cleanly</text>

    <!-- Step 4 -->
    <rect x="0" y="130" width="260" height="110" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="20" y="165" font-family="sans-serif" font-size="14" font-weight="800" fill="#c084fc">4. Test &amp; Validate Demand</text>
    <text x="20" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">Use pre-orders or landing</text>
    <text x="20" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">pages before heavy capital</text>

    <!-- Step 5 -->
    <rect x="290" y="130" width="260" height="110" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <text x="310" y="165" font-family="sans-serif" font-size="14" font-weight="800" fill="#f472b6">5. Repeatable Revenue</text>
    <text x="310" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">Structure recurring or</text>
    <text x="310" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">repeat purchasing models</text>

    <!-- Step 6 -->
    <rect x="580" y="130" width="260" height="110" rx="12" fill="#1e293b" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="600" y="165" font-family="sans-serif" font-size="14" font-weight="800" fill="#a7f3d0">6. Reinvest Profits</text>
    <text x="600" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">Reinvest into product,</text>
    <text x="600" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">marketing &amp; automation</text>
  </g>
</svg>
