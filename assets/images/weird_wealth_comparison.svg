<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wwCompBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="compGradWw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#wwCompBg)" rx="16"/>
  <circle cx="150" cy="350" r="180" fill="#34d399" opacity="0.1" filter="blur(45px)"/>

  <rect x="40" y="40" width="920" height="420" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="url(#compGradWw)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="80" y="95" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff">Viral Money vs. Sustainable Weird Wealth</text>
  <text x="80" y="125" font-family="sans-serif" font-size="15" fill="#cbd5e1">Distinguishing Short-Lived Attention Spikes from Durable Niche Revenue</text>

  <!-- Comparison Table Graphic -->
  <g transform="translate(80, 155)">
    <rect x="0" y="0" width="840" height="250" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="840" height="45" rx="12" fill="#0f172a"/>
    <text x="30" y="28" font-family="sans-serif" font-size="14" font-weight="800" fill="#fbbf24">DIMENSION</text>
    <text x="320" y="28" font-family="sans-serif" font-size="14" font-weight="800" fill="#f87171">VIRAL MONEY (HYPE)</text>
    <text x="610" y="28" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">SUSTAINABLE WEIRD WEALTH</text>

    <!-- Row 1 -->
    <line x1="0" y1="45" x2="840" y2="45" stroke="#334155" stroke-width="1"/>
    <text x="30" y="75" font-family="sans-serif" font-size="13" fill="#ffffff">Primary Driver</text>
    <text x="320" y="75" font-family="sans-serif" font-size="13" fill="#f87171">Temporary Social Attention</text>
    <text x="610" y="75" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">Durable Customer Value</text>

    <!-- Row 2 -->
    <line x1="0" y1="95" x2="840" y2="95" stroke="#334155" stroke-width="1"/>
    <text x="30" y="125" font-family="sans-serif" font-size="13" fill="#ffffff">Longevity</text>
    <text x="320" y="125" font-family="sans-serif" font-size="13" fill="#cbd5e1">Fades Quickly (Weeks/Months)</text>
    <text x="610" y="125" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">Designed for Multi-Year Retention</text>

    <!-- Row 3 -->
    <line x1="0" y1="145" x2="840" y2="145" stroke="#334155" stroke-width="1"/>
    <text x="30" y="175" font-family="sans-serif" font-size="13" fill="#ffffff">Predictability</text>
    <text x="320" y="175" font-family="sans-serif" font-size="13" fill="#cbd5e1">Highly Unpredictable Spikes</text>
    <text x="610" y="175" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">Measurable Recurring Cash Flow</text>

    <!-- Row 4 -->
    <line x1="0" y1="195" x2="840" y2="195" stroke="#334155" stroke-width="1"/>
    <text x="30" y="225" font-family="sans-serif" font-size="13" fill="#ffffff">Core Business Focus</text>
    <text x="320" y="225" font-family="sans-serif" font-size="13" fill="#cbd5e1">Riding Trends &amp; Views</text>
    <text x="610" y="225" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">Unit Economics &amp; Customer Trust</text>
  </g>
</svg>
