<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sdCredBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132c"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="credGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#sdCredBg)" rx="16"/>
  <circle cx="850" cy="380" r="190" fill="#10b981" opacity="0.1" filter="blur(45px)"/>

  <rect x="40" y="40" width="920" height="420" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="url(#credGrad)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="80" y="95" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff">Evaluating SimplifyDiggs.com Content &amp; Credibility</text>
  <text x="80" y="125" font-family="sans-serif" font-size="15" fill="#cbd5e1">6-Step Evaluation Checklist for Readers &amp; Digital Researchers</text>

  <!-- Checklist Components -->
  <g transform="translate(80, 155)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="260" height="110" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">1. HTTPS Security</text>
    <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Check connection SSL</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">and domain authenticity.</text>

    <!-- Item 2 -->
    <rect x="290" y="0" width="260" height="110" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="310" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#c084fc">2. Publication Date</text>
    <text x="310" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Verify article freshness</text>
    <text x="310" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">for tech &amp; fast trends.</text>

    <!-- Item 3 -->
    <rect x="580" y="0" width="260" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="600" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8">3. Author Transparency</text>
    <text x="600" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Check author credentials</text>
    <text x="600" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">and topic expertise.</text>

    <!-- Item 4 -->
    <rect x="0" y="130" width="260" height="110" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="20" y="165" font-family="sans-serif" font-size="14" font-weight="800" fill="#fbbf24">4. Primary Sources</text>
    <text x="20" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">Cross-reference claims</text>
    <text x="20" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">with official documentation.</text>

    <!-- Item 5 -->
    <rect x="290" y="130" width="260" height="110" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
    <text x="310" y="165" font-family="sans-serif" font-size="14" font-weight="800" fill="#f472b6">5. Domain Verification</text>
    <text x="310" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">Distinguish .com, .net</text>
    <text x="310" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">and similar domain names.</text>

    <!-- Item 6 -->
    <rect x="580" y="130" width="260" height="110" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="600" y="165" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">6. Decision Context</text>
    <text x="600" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">Use general content for intro,</text>
    <text x="600" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">not sole medical/legal advice.</text>
  </g>
</svg>
