<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="tpwHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132c"/>
      <stop offset="50%" stop-color="#152e4d"/>
      <stop offset="100%" stop-color="#070d1e"/>
    </linearGradient>
    <linearGradient id="tpwTealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="tpwBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="tpwShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#tpwHeroBg)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glowing Accents -->
  <circle cx="180" cy="180" r="240" fill="#14b8a6" opacity="0.12" filter="blur(50px)"/>
  <circle cx="1020" cy="450" r="260" fill="#38bdf8" opacity="0.1" filter="blur(50px)"/>

  <!-- Main Container Card -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#ffffff" fill-opacity="0.04" stroke="url(#tpwTealGrad)" stroke-width="2" filter="url(#tpwShadow)"/>

  <!-- Left Content Info -->
  <text x="140" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#2dd4bf" letter-spacing="2">MULTI-NICHE DIGITAL PUBLISHING GUIDE</text>
  
  <text x="140" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="#ffffff">TablesProWorld.com Guide</text>
  
  <text x="140" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600" fill="#cbd5e1">Content Verticals, Reliability &amp; Reader Evaluation</text>

  <!-- Category Badges -->
  <g transform="translate(140, 320)">
    <rect x="0" y="0" width="140" height="40" rx="20" fill="url(#tpwTealGrad)"/>
    <text x="70" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Technology</text>

    <rect x="155" y="0" width="130" height="40" rx="20" fill="url(#tpwBlueGrad)"/>
    <text x="220" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Business</text>

    <rect x="300" y="0" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="360" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Finance</text>

    <rect x="435" y="0" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="495" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Health</text>
  </g>

  <!-- Right Side Graphic: Digital Portal Layout Mockup -->
  <g transform="translate(740, 140)">
    <rect x="0" y="0" width="280" height="380" rx="24" fill="#0f2942" stroke="#334155" stroke-width="3" filter="url(#tpwShadow)"/>
    <rect x="12" y="16" width="256" height="348" rx="16" fill="#071828"/>

    <!-- Search Header -->
    <rect x="25" y="35" width="230" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="60" font-family="sans-serif" font-size="12" fill="#94a3b8">🌐 TablesProWorld.com Hub</text>

    <!-- Content Card 1 -->
    <g transform="translate(25, 90)">
      <rect x="0" y="0" width="230" height="110" rx="10" fill="#152e4d"/>
      <text x="15" y="30" font-family="sans-serif" font-size="12" font-weight="800" fill="#2dd4bf">TECH &amp; DIGITAL TOOLS</text>
      <text x="15" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Software &amp; Productivity Guides</text>
      <text x="15" y="80" font-family="sans-serif" font-size="11" fill="#94a3b8">Accessible topics for general readers.</text>
    </g>

    <!-- Content Card 2 -->
    <g transform="translate(25, 215)">
      <rect x="0" y="0" width="230" height="115" rx="10" fill="#0d9488" fill-opacity="0.15" stroke="#14b8a6" stroke-width="1"/>
      <text x="15" y="30" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8">MULTI-NICHE HUB</text>
      <text x="15" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1">Business, Health, Travel &amp; Auto</text>
      <rect x="15" y="65" width="200" height="35" rx="6" fill="url(#tpwTealGrad)"/>
      <text x="115" y="87" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Explore Articles →</text>
    </g>
  </g>

  <!-- CNLawBlog Footer Seal -->
  <g transform="translate(140, 420)">
    <rect x="0" y="0" width="380" height="70" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff">CNLawBlog Tech &amp; Media Analysis</text>
    <text x="20" y="52" font-family="sans-serif" font-size="12" fill="#94a3b8">Verified Editorial Review • cnlawblog.shop</text>
  </g>
</svg>
