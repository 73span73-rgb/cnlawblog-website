<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tpwCompBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#071828"/>
    </linearGradient>
    <linearGradient id="compGradTpw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#tpwCompBg)" rx="16"/>
  <circle cx="180" cy="380" r="190" fill="#14b8a6" opacity="0.1" filter="blur(45px)"/>

  <rect x="40" y="40" width="920" height="420" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="url(#compGradTpw)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="80" y="95" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff">TablesProWorld.com vs. Specialist Websites Comparison</text>
  <text x="80" y="125" font-family="sans-serif" font-size="15" fill="#cbd5e1">Matching Research Goals with Appropriate Source Quality &amp; Professional Authority</text>

  <!-- Comparison Table Graphic -->
  <g transform="translate(80, 155)">
    <rect x="0" y="0" width="840" height="250" rx="12" fill="#152e4d" stroke="#334155" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="840" height="45" rx="12" fill="#071828"/>
    <text x="30" y="28" font-family="sans-serif" font-size="14" font-weight="800" fill="#2dd4bf">RESEARCH NEED</text>
    <text x="380" y="28" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8">BETTER STARTING POINT</text>

    <!-- Row 1 -->
    <line x1="0" y1="45" x2="840" y2="45" stroke="#334155" stroke-width="1"/>
    <text x="30" y="75" font-family="sans-serif" font-size="13" fill="#ffffff">General Topic Overview</text>
    <text x="380" y="75" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">TablesProWorld.com or General Interest Site</text>

    <!-- Row 2 -->
    <line x1="0" y1="95" x2="840" y2="95" stroke="#334155" stroke-width="1"/>
    <text x="30" y="125" font-family="sans-serif" font-size="13" fill="#ffffff">Software Instructions &amp; Tech Specs</text>
    <text x="380" y="125" font-family="sans-serif" font-size="13" font-weight="700" fill="#60a5fa">Official Software Documentation</text>

    <!-- Row 3 -->
    <line x1="0" y1="145" x2="840" y2="145" stroke="#334155" stroke-width="1"/>
    <text x="30" y="175" font-family="sans-serif" font-size="13" fill="#ffffff">Medical Information &amp; Health Decisions</text>
    <text x="380" y="175" font-family="sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Medical Institutions &amp; Qualified Professionals</text>

    <!-- Row 4 -->
    <line x1="0" y1="195" x2="840" y2="195" stroke="#334155" stroke-width="1"/>
    <text x="30" y="225" font-family="sans-serif" font-size="13" fill="#ffffff">Financial Decisions &amp; Regulations</text>
    <text x="380" y="225" font-family="sans-serif" font-size="13" font-weight="700" fill="#c084fc">Regulators, Financial Institutions &amp; Advisers</text>
  </g>
