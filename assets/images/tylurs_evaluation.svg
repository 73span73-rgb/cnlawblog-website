<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tylEvalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132c"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="evalGradTyl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#tylEvalBg)" rx="16"/>
  <circle cx="850" cy="380" r="190" fill="#34d399" opacity="0.1" filter="blur(45px)"/>

  <rect x="40" y="40" width="920" height="420" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="url(#evalGradTyl)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="80" y="95" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff">5-Minute Process to Evaluate a Tylurs.com Article</text>
  <text x="80" y="125" font-family="sans-serif" font-size="15" fill="#cbd5e1">Simple Verification Steps for Smart Digital Research</text>

  <!-- Checklist Components -->
  <g transform="translate(80, 155)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="260" height="110" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="20" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">1. Check Headline</text>
    <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Does it answer your exact</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">searched question directly?</text>

    <!-- Item 2 -->
    <rect x="290" y="0" width="260" height="110" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="310" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#818cf8">2. Check Author</text>
    <text x="310" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Is author background relevant</text>
    <text x="310" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">to the specific topic?</text>

    <!-- Item 3 -->
    <rect x="580" y="0" width="260" height="110" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="600" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#fbbf24">3. Check Date</text>
    <text x="600" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Could details have changed</text>
    <text x="600" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">since publication?</text>

    <!-- Item 4 -->
    <rect x="0" y="130" width="260" height="110" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="20" y="165" font-family="sans-serif" font-size="14" font-weight="800" fill="#c084fc">4. Check Sources</text>
    <text x="20" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">Are claims supported by</text>
    <text x="20" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">reliable external citations?</text>

    <!-- Item 5 -->
    <rect x="290" y="130" width="260" height="110" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
    <text x="310" y="165" font-family="sans-serif" font-size="14" font-weight="800" fill="#f472b6">5. Cross-Check Facts</text>
    <text x="310" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">For high-stakes topics,</text>
    <text x="310" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">verify with primary sources.</text>
  </g>
</svg>
